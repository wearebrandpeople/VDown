<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https: http: data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Video İndir</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="native.css"><script defer src="lucide.js"></script><script defer src="app.js"></script></head>
<body><div id="video-mac-preview"><div class="vm-window"><main class="vm-main">
<form class="vm-link-form"><label for="vm-url">Video bağlantısı</label><div class="vm-input-row"><div class="vm-input-wrap"><i data-lucide="link" aria-hidden="true"></i><textarea id="vm-url" rows="1" placeholder="Video bağlantısını yapıştır" required autocomplete="off" spellcheck="false"></textarea></div><button class="vm-button vm-preview" type="button">Önizle</button></div></form>
<button class="vm-text-button vm-playlist" type="button" hidden>Çalma listesini seç</button>
<div class="vm-video" hidden><div class="vm-video-top"><img class="vm-cover" alt="Video kapağı" referrerpolicy="no-referrer"><div class="vm-cover-fallback" hidden>Kapak bulunamadı</div><div class="vm-details"><h3></h3><p></p></div></div></div>
<section class="vm-collection" aria-label="İndirilecek videolar" hidden><h3></h3><label class="vm-check-all"><input type="checkbox" checked> <span>Tümünü seç</span></label><div class="vm-collection-list"></div><p class="vm-collection-count"></p></section>
<div class="vm-settings" hidden><button class="vm-button vm-primary vm-download" type="button"><i data-lucide="arrow-down-to-line" aria-hidden="true"></i>İndir</button><div class="vm-quality" data-dropdown="quality"><button id="vm-quality" class="vm-button vm-quality-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="vm-quality-options"><span>En iyi kalite</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><div id="vm-quality-options" class="vm-quality-menu" role="listbox" aria-label="Çözünürlük" hidden></div></div><div class="vm-quality" data-dropdown="mode"><button id="vm-mode" class="vm-button vm-quality-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="vm-mode-options"><span>Video</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><div id="vm-mode-options" class="vm-quality-menu" role="listbox" aria-label="İndirme biçimi" hidden></div></div></div>
<p class="vm-mode-note" hidden></p>
<button class="vm-folder" type="button" hidden><i data-lucide="folder" aria-hidden="true"></i><span>İndirilenler</span><i data-lucide="chevron-down" aria-hidden="true"></i></button>
<section class="vm-downloads" aria-label="İndirmeler"><div class="vm-section-title"><h3>İndirmeler</h3><div class="vm-history-actions"><span class="vm-count">0 öğe</span><button class="vm-text-button vm-clear-history" type="button" title="Biten, iptal edilen ve başarısız işleri listeden kaldırır; dosyaları silmez." disabled>Temizle</button></div></div><div class="vm-empty"><i data-lucide="arrow-down-to-line" aria-hidden="true"></i><p>İndirmelerin burada görünecek.</p></div><div class="vm-list"></div></section>
<p class="vm-status" role="status" aria-live="polite"></p>
</main><footer class="vm-footer"><button class="vm-footer-folder" type="button" aria-label="Kayıt klasörünü seç"><i data-lucide="folder" aria-hidden="true"></i><span>İndirilenler</span></button><button class="vm-text-button vm-main-button" type="button">Ana pencere</button><button class="vm-text-button vm-settings-open" type="button">Ayarlar</button></footer><dialog class="vm-settings-dialog" aria-labelledby="vm-settings-heading"><div class="vm-dialog-header"><h3 id="vm-settings-heading">Ayarlar</h3><button class="vm-settings-close vm-text-button" type="button" aria-label="Ayarları kapat"><i data-lucide="x" aria-hidden="true"></i></button></div><label class="vm-setting-row"><span>Başlangıçta çalıştır<small><span class="vm-login-status">Mac’e giriş yaptığında uygulama açılsın.</span></small></span><input type="checkbox" role="switch" data-setting="launchAtLogin"></label><button class="vm-login-approval vm-text-button" type="button" hidden>Sistem Ayarları’nda onayla</button><label class="vm-setting-row"><span>Menü çubuğunda göster<small>Üstte simge, ilerleme ve hızlı panel.</small></span><input type="checkbox" role="switch" data-setting="showMenuBar"></label><label class="vm-setting-row"><span>Açılışta indirmelere devam et<small>Yarım kalan ve sıradaki işleri sürdür.</small></span><input type="checkbox" role="switch" data-setting="resumeOnLaunch"></label><div class="vm-setting-row"><span>Kayıt klasörü<small class="vm-settings-folder"></small></span><button class="vm-text-button vm-change-folder" type="button">Değiştir</button></div><div class="vm-setting-row"><span>İndirme motoru<small>Site uyumluluğunu güncel tut.</small></span><button class="vm-text-button vm-update" type="button">Güncelle</button></div><p class="vm-update-status" role="status" aria-live="polite"></p><p class="vm-settings-message" role="status" aria-live="polite"></p></dialog></div></div></body></html>
